<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- PROFILE CARD -->
    <div class="card-white text-center">
      <h1>Hello, Class</h1>

      <img src="image/image.jpg" alt="profile photo" id="home-page-first-image">

      <p>
        You can emphasize <em>some words</em>,
        and even <strong>more if needed</strong>
      </p>
    </div>

    <!-- BEATLES IMAGES -->
    <div class="card-white text-center">
      <h2>My Favorite Artists</h2>

      <div class="image-row">
        <img src="image/john.png" class="img-circle" alt="John">
        <img src="image/ringo.png" class="img-circle" alt="Ringo">
        <img src="image/george.png" class="img-circle" alt="George">
        <img src="image/paul.png" class="img-circle" alt="Paul">
      </div>

    </div>

    <!-- SHOPPING LIST -->
    <div class="card-white">
      <h2>Shopping List</h2>
      <ul>
        <li>Milk</li>
        <li>Butter</li>
      </ul>
    </div>

    <!-- SOCIAL -->
    <div class="card-white text-center">
      <h3>Follow me</h3>
      <ul class="list-inline">
        <li><a href="#">Facebook</a></li>
        <li><a href="#">LinkedIn</a></li>
        <li><a href="#">Twitter</a></li>
      </ul>
    </div>

  </div>

</body>

</html>
